apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def releaseStoreFile = project.findProperty('releaseStoreFile')
def releaseStorePassword = project.findProperty('releaseStorePassword')
def releaseKeyAlias = project.findProperty('releaseKeyAlias')
def releaseKeyPassword = project.findProperty('releaseKeyPassword')
def releaseSigningConfigured = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && it.toString().trim() }

android {
    namespace 'com.juliablack.blocker5g'
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.juliablack.blocker5g"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 13
        versionName "2.0"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.activity:activity-compose:1.3.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.compose.runtime:runtime:1.0.5'
    implementation 'androidx.compose.ui:ui:1.0.5'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.0.5'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.0.5'
    implementation 'androidx.compose.material:material:1.0.5'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    testImplementation 'junit:junit:4.12'
    implementation "androidx.multidex:multidex:2.0.1"

    //implementation 'com.google.android.gms:play-services-ads:20.1.0'
}
